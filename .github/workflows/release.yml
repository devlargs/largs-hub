name: Release

on:
  push:
    branches: [main]
    # A docs or CI commit shouldn't mint a version, publish an installer and
    # prompt every user to update. Code changes still release automatically.
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".vscode/**"
      - "LICENSE"
  # Ship a release for an ignored-path commit (or re-run a failed one) on demand.
  workflow_dispatch:

permissions:
  contents: write

# One release at a time per branch. A newer push to main cancels the run that is
# still going and releases from the newer commit instead, so the version bump,
# tag and changelog always describe the tip of main rather than a stale commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out the next patch version and release date once, so the Windows and
  # macOS builds stamp the same number and changelog heading. Nothing is
  # committed until both builds have succeeded.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      date: ${{ steps.version.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute next patch version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          echo "version=$MAJOR.$MINOR.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          # One DMG per CPU (arm64 for Apple Silicon, x64 for Intel), built on
          # the Apple Silicon runner. The in-app updater picks the one matching
          # the Mac it runs on.
          - os: macos-latest
            platform: mac
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version

      # The in-app Changelog page bundles CHANGELOG.md, so it has to carry this
      # version's heading before the build, not only in the commit afterwards.
      - name: Stamp changelog
        run: node scripts/stamp-changelog.cjs "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.date }}"

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run electron:build -- --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer ID: don't go looking for one in the keychain.
          # The afterPack hook ad-hoc signs the macOS app instead.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE_DATE: ${{ needs.version.outputs.date }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Commit version bump
        run: |
          npm version "$VERSION" --no-git-tag-version
          git config user.name "Ralph Largo"
          git config user.email "devlargs@gmail.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v$VERSION"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg

      # Same stamp the builds applied, so the committed file matches what shipped
      - name: Update CHANGELOG.md
        run: node scripts/stamp-changelog.cjs "$VERSION" "$RELEASE_DATE"

      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update changelog for v$VERSION"
            git push
          fi
