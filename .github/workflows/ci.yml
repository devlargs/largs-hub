name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only the newest commit on a branch or PR is worth checking. A newer push
# cancels the run still in flight and the checks start again on that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

  # The shipped artifact is built on Windows, so a packaging break has to be
  # caught on Windows too — checks alone never compile the Electron bundle.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main
        run: npm run build

      # --dir packages without producing an installer: enough to catch a broken
      # electron-builder config without the cost of a full NSIS build.
      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
