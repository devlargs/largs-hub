version: 2

# Weekly PRs for vulnerable or outdated dependencies (issue #126). Minor and
# patch bumps are grouped into one PR per ecosystem so they don't pile up.
# Electron majors come through here too; the weekly Electron support check
# (electron-support.yml) is what flags one that's about to lose security fixes.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only, so TypeScript 7
      # would break `npm run lint`. Drop this once typescript-eslint supports it.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
